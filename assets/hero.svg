<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="shiro, security researcher">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

    /* kanji traces itself once */
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(.6,.05,.3,1) forwards; }
    .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .5s; }
    .d4 { animation-delay: .75s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* red ghost copy: mostly hidden, tears sideways now and then */
    .ghost { opacity: 0; animation: ghost 7s 2.4s infinite; }
    @keyframes ghost {
      0%, 86%, 100% { opacity: 0; transform: translate(0, 0); }
      88% { opacity: .85; transform: translate(-9px, 2px); }
      90% { opacity: .0;  transform: translate(6px, -3px); }
      92% { opacity: .7;  transform: translate(-4px, 0); }
      95% { opacity: 0; }
    }
    .jolt { animation: jolt 7s 2.4s infinite; }
    @keyframes jolt {
      0%, 86%, 100% { transform: translate(0, 0); }
      88% { transform: translate(3px, 0); }
      92% { transform: translate(-2px, 1px); }
    }

    /* typed line */
    .type { animation: type 2.4s 1.6s steps(30) forwards; }
    @keyframes type { from { width: 0; } to { width: 330px; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* slow scan band */
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(400px); } }

    .fade { opacity: 0; animation: fade .8s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
  </style>

  <defs>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" opacity=".035"/>
    </pattern>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#ff2e4d" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ff2e4d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typeclip">
      <rect class="type" x="76" y="232" width="0" height="28"/>
    </clipPath>
  </defs>

  <!-- base -->
  <rect width="900" height="320" fill="#09090b"/>
  <rect width="900" height="320" fill="url(#glow)"/>
  <rect width="900" height="320" fill="url(#lines)"/>

  <!-- corner ticks -->
  <g stroke="#ff2e4d" stroke-width="2" fill="none" stroke-linecap="square">
    <path d="M24 44 V24 H44"/>
    <path d="M876 276 V296 H856"/>
  </g>
  <g stroke="#2a2a2f" stroke-width="1" fill="none">
    <path d="M856 24 H876 V44"/>
    <path d="M24 276 V296 H44"/>
  </g>

  <!-- kanji: 白 (shiro / white), drawn from strokes so no font is needed -->
  <g transform="translate(650 22)" fill="none" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter">
    <!-- red ghost -->
    <g class="ghost" stroke="#ff2e4d">
      <path d="M108 4 L90 42"/>
      <path d="M40 74 H160 V252 H40 Z"/>
      <path d="M40 163 H160"/>
    </g>
    <!-- main -->
    <g class="jolt" stroke="#f4f4f5">
      <path class="draw" pathLength="1" d="M108 4 L90 42"/>
      <path class="draw d2" pathLength="1" d="M40 74 V252 H160 V74 H40"/>
      <path class="draw d3" pathLength="1" d="M40 163 H160"/>
    </g>
  </g>

  <!-- text -->
  <g class="mono">
    <text class="fade" x="76" y="84" font-size="14" fill="#5b5b63" letter-spacing="3" style="animation-delay:.2s">BLANKSHIRO / SECURITY RESEARCH</text>

    <text class="fade" x="70" y="172" font-size="92" font-weight="700" fill="#f4f4f5" letter-spacing="-4" style="animation-delay:.5s">shiro</text>
    <rect class="fade" x="76" y="188" width="44" height="4" fill="#ff2e4d" style="animation-delay:.9s"/>

    <text class="fade" x="76" y="222" font-size="17" fill="#a1a1aa" style="animation-delay:1s">vulnerability assessment  /  penetration testing</text>

    <text x="76" y="252" font-size="17" fill="#ff2e4d">$</text>
    <g clip-path="url(#typeclip)">
      <text x="98" y="252" font-size="17" fill="#e4e4e7">find the assumption. break it.</text>
    </g>
    <rect class="cursor" x="409" y="238" width="10" height="18" fill="#f4f4f5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.01s" fill="freeze"/>
    </rect>
  </g>

  <!-- scan band on top -->
  <rect class="scan" width="900" height="80" fill="url(#band)" y="-80"/>
</svg>
